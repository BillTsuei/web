<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多媒體卡片展示</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 1. 上方圖片區域 (含浮動互動按鈕與彈出面板) */
    .media-container {
      position: relative;
      width: 100%;
      height: 240px;
      background-color: #e9ecef;
      overflow: hidden;
    }

    .media-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 右下角浮動按鈕 Trigger */
    .interaction-trigger {
      position: absolute;
      bottom: 12px;
      right: 12px;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      color: #fff;
      border: none;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.2s ease;
      z-index: 5;
    }

    .interaction-trigger:hover {
      background: rgba(0, 0, 0, 0.85);
    }

    /* 可收起的互動視窗 Overlay (預設隱藏) */
    .interaction-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      color: #fff;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 10;
    }

    .interaction-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .overlay-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      padding-bottom: 8px;
    }

    .overlay-title {
      font-size: 14px;
      font-weight: 600;
    }

    .close-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      padding: 4px;
    }

    .overlay-actions {
      display: flex;
      gap: 15px;
      margin-top: 10px;
    }

    .action-btn {
      background: rgba(255, 255, 255, 0.15);
      border: none;
      color: #fff;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .action-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .action-btn.liked {
      color: #ff4757;
    }

    .comments-preview {
      flex-grow: 1;
      margin-top: 10px;
      font-size: 12px;
      color: #ddd;
      overflow-y: auto;
      max-height: 110px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .comment-item {
      background: rgba(255, 255, 255, 0.1);
      padding: 6px 8px;
      border-radius: 4px;
    }

    /* 2. 下方文字內容區（精準維持 6 個欄位） */
    .content-container {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* 欄位 1: 標題 */
    .field-title {
      font-size: 18px;
      font-weight: 700;
      color: #2c3e50;
      line-height: 1.3;
    }

    /* 欄位 2: 副標題 */
    .field-subtitle {
      font-size: 13px;
      color: #7f8c8d;
      font-weight: 500;
      margin-top: -4px;
    }

    /* 欄位 3: 摘要說明 */
    .field-summary {
      font-size: 14px;
      color: #4a5568;
      line-height: 1.5;
    }

    /* 欄位 4: 分類標籤 */
    .field-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 2px;
    }

    .tag {
      background-color: #e8f4fd;
      color: #1e88e5;
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 500;
    }

    /* 欄位 5: 發布時間與作者 */
    .field-meta {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #a0aec0;
      border-top: 1px solid #edf2f7;
      padding-top: 10px;
      margin-top: 4px;
    }

    /* 欄位 6: 行動呼籲 / 延伸連結 */
    .field-action {
      margin-top: 4px;
    }

    .action-link {
      display: block;
      width: 100%;
      text-align: center;
      background-color: #3182ce;
      color: #ffffff;
      text-decoration: none;
      padding: 10px 0;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      transition: background-color 0.2s;
    }

    .action-link:hover {
      background-color: #2b6cb0;
    }
  </style>
</head>
<body>

  <div class="card">
    
    <!-- 圖像顯示區 (右下角含可收合互動介面) -->
    <div class="media-container">
      <img src="https://picsum.photos/400/240" alt="封面圖片">

      <!-- 右下角觸發按鈕 -->
      <button class="interaction-trigger" onclick="toggleOverlay(true)">
        <span><i class="fa-regular fa-heart"></i> <span id="like-count-badge">24</span></span>
        <span><i class="fa-regular fa-comment"></i> <span id="comment-count-badge">3</span></span>
      </button>

      <!-- 可收起的互動視窗 (Overlay) -->
      <div class="interaction-overlay" id="interactionOverlay">
        <div class="overlay-header">
          <span class="overlay-title">社群互動</span>
          <button class="close-btn" onclick="toggleOverlay(false)"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div class="overlay-actions">
          <button class="action-btn" id="likeBtn" onclick="toggleLike()">
            <i class="fa-regular fa-heart" id="likeIcon"></i>
            <span id="likeText">讚</span> (<span id="overlayLikeCount">24</span>)
          </button>
          <button class="action-btn">
            <i class="fa-regular fa-comment"></i> 留言
          </button>
        </div>

        <div class="comments-preview">
          <div class="comment-item"><strong>陳醫師:</strong> 非常實用的衛教資訊！</div>
          <div class="comment-item"><strong>林小姐:</strong> 感謝分享，已收藏。</div>
          <div class="comment-item"><strong>張先生:</strong> 請收下我的讚！</div>
        </div>
      </div>
    </div>

    <!-- 文字內容區：維持原本 6 個欄位 -->
    <div class="content-container">
      <!-- 欄位 1: 標題 -->
      <h2 class="field-title">腦卒中急救與預防指南</h2>

      <!-- 欄位 2: 副標題 -->
      <h3 class="field-subtitle">神經內科醫師帶您掌握黃金救援時間</h3>

      <!-- 欄位 3: 摘要說明 -->
      <p class="field-summary">
        急性腦中風發生時，每分每秒都至關重要。學會識別 FAST 口訣，能有效幫助患者在黃金時間內接受及時治療。
      </p>

      <!-- 欄位 4: 分類標籤 -->
      <div class="field-tags">
        <span class="tag">#衛教資訊</span>
        <span class="tag">#腦血管健康</span>
        <span class="tag">#急救知識</span>
      </div>

      <!-- 欄位 5: 發布時間與作者 -->
      <div class="field-meta">
        <span>作者：醫療團隊</span>
        <span>發布於 2026-09-26</span>
      </div>

      <!-- 欄位 6: 行動呼籲 / 延伸連結 -->
      <div class="field-action">
        <a href="#" class="action-link">閱讀完整衛教文章</a>
      </div>
    </div>

  </div>

  <script>
    let isLiked = false;
    let likeCount = 24;

    function toggleOverlay(show) {
      const overlay = document.getElementById('interactionOverlay');
      if (show) {
        overlay.classList.add('active');
      } else {
        overlay.classList.remove('active');
      }
    }

    function toggleLike() {
      const likeBtn = document.getElementById('likeBtn');
      const likeIcon = document.getElementById('likeIcon');
      const badgeCount = document.getElementById('like-count-badge');
      const overlayCount = document.getElementById('overlayLikeCount');

      isLiked = !isLiked;
      
      if (isLiked) {
        likeCount++;
        likeBtn.classList.add('liked');
        likeIcon.className = 'fa-solid fa-heart';
      } else {
        likeCount--;
        likeBtn.classList.remove('liked');
        likeIcon.className = 'fa-regular fa-heart';
      }

      badgeCount.innerText = likeCount;
      overlayCount.innerText = likeCount;
    }
  </script>
</body>
</html>
